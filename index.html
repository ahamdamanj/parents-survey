<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نامەی دڵسۆزی و ڕەزامەندی</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700&family=Reem+Kufi:wght@500;700&display=swap');

        :root {
            --primary: #5c3d2e;
            --accent: #b8860b;
            --bg-gradient: linear-gradient(135deg, #fdfbf7 0%, #f3ece2 100%);
            --card-bg: #ffffff;
            --text-color: #4a3b32;
            --border-color: #e6ded1;
        }

        body {
            background: var(--bg-gradient);
            margin: 0;
            padding: 20px;
            font-family: 'Vazirmatn', sans-serif;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: var(--card-bg);
            padding: 45px 35px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(92, 61, 46, 0.08);
            width: 100%;
            max-width: 480px;
            border: 1px solid var(--border-color);
            position: relative;
            text-align: center;
        }

        .header h2 {
            font-family: 'Reem Kufi', sans-serif;
            color: var(--primary);
            margin: 0 0 10px 0;
            font-size: 26px;
        }

        .subtitle {
            font-size: 14px;
            color: #8c7a6b;
            margin-bottom: 25px;
        }

        .divider {
            width: 50px;
            height: 3px;
            background: var(--accent);
            margin: 0 auto 25px auto;
            border-radius: 2px;
        }

        .form-group {
            margin-bottom: 22px;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 15px;
            color: var(--primary);
        }

        textarea, select {
            width: 100%;
            padding: 14px;
            border: 1.5px solid var(--border-color);
            background: #faf8f5;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 14px;
            border-radius: 10px;
            transition: all 0.3s ease;
            color: var(--text-color);
        }

        textarea:focus, select:focus {
            border-color: var(--accent);
            outline: none;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(184, 134, 11, 0.15);
        }

        button {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 15px;
            width: 100%;
            font-family: 'Reem Kufi', sans-serif;
            font-size: 16px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 10px;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(92, 61, 46, 0.2);
        }

        button:hover {
            background: #432b1f;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(92, 61, 46, 0.3);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <h2></h2>
            <div class="subtitle">تکایە بە ڕاشکاوی وەڵامی ئەم پرسیارانە بدەنەوە</div>
            <div class="divider"></div>
        </div>
        
        <form id="surveyForm" onsubmit="sendToWhatsApp(event)">
            <div class="form-group">
                <label>چ شتێک هەیەلە منداکە بەدڵتان نییە؟</label>
                <textarea id="dislike" rows="4" placeholder="ڕای خۆتان لێرە بنووسن..." required></textarea>
            </div>

            <div class="form-group">
                <label>ئایا ڕازین لێم و گەردنم ئازاد دەکەن؟</label>
                <select id="forgiveness" required>
                    <option value="">هەڵبژێرن...</option>
                    <option value="بەڵێ، خوا لێت ڕازی بێت و گەردنت ئازاد بێت">بەڵێ، ڕازین لێت</option>
                    <option value="نەخێر، پێویستە هەندێک شت بگۆڕیت">نەخێر، پێویستە هەندێک شت بگۆڕیت</option>
                </select>
            </div>

            <button type="submit">ناردنی وەڵام بۆ واتسئەپ</button>
        </form>
    </div>

    <script>
        function sendToWhatsApp(event) {
            event.preventDefault();
            const myPhoneNumber = "9647501086310"; 
            const dislike = document.getElementById('dislike').value.trim();
            const forgiveness = document.getElementById('forgiveness').value;

            const message = 
                            "📝 سەرنجیان: " + dislike + "\n\n" +
                            "✨ گەردن ئازادکردن: " + forgiveness;

            const whatsappURL = "https://api.whatsapp.com/send?phone=" + myPhoneNumber + "&text=" + encodeURIComponent(message);
            window.location.href = whatsappURL;
        }
    </script>
</body>
</html>
